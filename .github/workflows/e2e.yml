name: E2E Tests

on:
  push:
    branches: [main, feature/*]
  pull_request:
    branches: [main]

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: cd e2e && npx playwright install --with-deps

      - name: Build shared package
        run: npm run build --workspace=@todo/shared

      - name: Build API
        run: npm run build --workspace=@todo/api

      - name: Build Web
        run: npm run build --workspace=@todo/web

      - name: Start API server
        run: |
          cd apps/api
          npm run db:push
          npm start &
          npx wait-on http://localhost:3001/health --timeout 30000
        env:
          DATABASE_URL: file:./test.db
          JWT_SECRET: test-secret
          JWT_REFRESH_SECRET: test-refresh-secret
          PORT: 3001

      - name: Start Web server
        run: |
          cd apps/web
          npx serve -s dist -l 3000 &
          npx wait-on http://localhost:3000 --timeout 30000

      - name: Run E2E tests
        run: cd e2e && npm run test
        env:
          BASE_URL: http://localhost:3000

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 30

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-results
          path: e2e/test-results/
          retention-days: 7
