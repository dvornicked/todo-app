<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo App</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body>
    <div id="root"></div>
    
    <script type="text/babel">
        const { useState } = React;

        function App() {
            const [todos, setTodos] = useState([]);
            const [inputValue, setInputValue] = useState('');

            const addTodo = () => {
                if (inputValue.trim() === '') return;
                
                const newTodo = {
                    id: Date.now(),
                    text: inputValue.trim(),
                    completed: false,
                };
                
                setTodos([...todos, newTodo]);
                setInputValue('');
            };

            const toggleTodo = (id) => {
                setTodos(todos.map(todo => 
                    todo.id === id ? { ...todo, completed: !todo.completed } : todo
                ));
            };

            const deleteTodo = (id) => {
                setTodos(todos.filter(todo => todo.id !== id));
            };

            const handleKeyPress = (e) => {
                if (e.key === 'Enter') {
                    addTodo();
                }
            };

            const completedCount = todos.filter(t => t.completed).length;

            return (
                <div className="min-h-screen bg-gradient-to-br from-purple-500 via-pink-500 to-orange-400 flex items-center justify-center p-4">
                    <div className="w-full max-w-md bg-white rounded-2xl shadow-2xl overflow-hidden">
                        <div className="bg-gradient-to-r from-purple-600 to-pink-600 p-6 text-white">
                            <h1 className="text-3xl font-bold mb-2">📝 Мои дела</h1>
                            <p className="text-purple-100">
                                {todos.length === 0 
                                    ? 'Начни свой список задач'
                                    : `Выполнено: ${completedCount} из ${todos.length}`
                                }
                            </p>
                        </div>

                        <div className="p-6 border-b border-gray-100">
                            <div className="flex gap-2">
                                <input
                                    type="text"
                                    value={inputValue}
                                    onChange={(e) => setInputValue(e.target.value)}
                                    onKeyPress={handleKeyPress}
                                    placeholder="Что нужно сделать?"
                                    className="flex-1 px-4 py-3 border-2 border-gray-200 rounded-xl focus:outline-none focus:border-purple-500 transition-colors"
                                />
                                <button
                                    onClick={addTodo}
                                    className="px-6 py-3 bg-gradient-to-r from-purple-600 to-pink-600 text-white font-semibold rounded-xl hover:opacity-90 transition-opacity active:scale-95"
                                >
                                    +
                                </button>
                            </div>
                        </div>

                        <div className="max-h-96 overflow-y-auto">
                            {todos.length === 0 ? (
                                <div className="p-8 text-center text-gray-400">
                                    <div className="text-6xl mb-4">✨</div>
                                    <p>Нет задач — отличное время для отдыха!</p>
                                </div>
                            ) : (
                                <ul className="divide-y divide-gray-100">
                                    {todos.map((todo) => (
                                        <li
                                            key={todo.id}
                                            className="flex items-center gap-3 p-4 hover:bg-gray-50 transition-colors group"
                                        >
                                            <button
                                                onClick={() => toggleTodo(todo.id)}
                                                className={`w-6 h-6 rounded-full border-2 flex items-center justify-center transition-all ${
                                                    todo.completed
                                                        ? 'bg-green-500 border-green-500 text-white'
                                                        : 'border-gray-300 hover:border-purple-500'
                                                }`}
                                            >
                                                {todo.completed && '✓'}
                                            </button>
                                            
                                            <span
                                                className={`flex-1 ${
                                                    todo.completed
                                                        ? 'text-gray-400 line-through'
                                                        : 'text-gray-700'
                                                }`}
                                            >
                                                {todo.text}
                                            </span>
                                            
                                            <button
                                                onClick={() => deleteTodo(todo.id)}
                                                className="opacity-0 group-hover:opacity-100 px-3 py-1 text-red-500 hover:bg-red-50 rounded-lg transition-all"
                                            >
                                                🗑️
                                            </button>
                                        </li>
                                    ))}
                                </ul>
                            )}
                        </div>

                        {todos.length > 0 && (
                            <div className="p-4 bg-gray-50 text-center text-sm text-gray-500">
                                Нажми на кружок, чтобы отметить выполненным
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
