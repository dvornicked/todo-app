services:
  - type: web
    name: todo-backend
    env: node
    buildCommand: cd backend && npm install
    startCommand: cd backend && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: PORT
        value: 3001
      - key: FRONTEND_URL
        value: https://dvornicked.github.io
    disk:
      name: data
      mountPath: /opt/render/project/src/backend/data
      sizeGB: 1
